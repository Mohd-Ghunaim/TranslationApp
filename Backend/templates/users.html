<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='users.css') }}">
</head>
<body>

  <div class="card">

    <div class="buttons-bar">
      <button onclick="window.location.href='/admin-dashboard'" class="back-btn">Back to Dashboard</button>
    </div>

    <div class="card-content">
      <h2>User Management</h2>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="usersTable"></tbody>
      </table>
    </div>

  </div>

  <script>
    async function loadUsers() {
      const response = await fetch("/admin/users-data");
      const users = await response.json();

      const table = document.getElementById("usersTable");
      table.innerHTML = "";

      users.forEach(user => {
        const row = document.createElement("tr");

        const actionBtnClass = user.is_admin == 1 ? "demote-btn" : "promote-btn";
        const actionBtnText = user.is_admin == 1 ? "Demote" : "Promote";

        row.innerHTML = `
          <td>${user.id}</td>
          <td>${user.username}</td>
          <td>${user.is_admin == 1 ? "Admin" : "User"}</td>
          <td>
            <button class="${actionBtnClass}" onclick="toggleRole(${user.id}, ${user.is_admin})">
              ${actionBtnText}
            </button>
          </td>
        `;

        table.appendChild(row);
      });
    }

    async function toggleRole(id, currentRole) {
      const newRole = currentRole == 1 ? 0 : 1;

      await fetch("/admin/update-user", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ id: id, is_admin: newRole })
      });

      loadUsers();
    }

    loadUsers();
  </script>

</body>
</html>
